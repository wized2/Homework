<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Class 8 Homework Admin</title>
  <meta name="theme-color" content="#4F46E5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #4f46e5;
      --brand-soft: #eef2ff;
      --ok: #059669;
      --ok-bg: #ecfdf5;
      --err: #dc2626;
      --err-bg: #fef2f2;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      min-height: 100dvh;
    }
    .top {
      position: sticky; top: 0; z-index: 20;
      background: rgba(244,246,251,.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }
    .top-inner {
      max-width: 920px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--brand); color: #fff;
      display: grid; place-items: center;
    }
    .titles h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
    .titles p { margin: 2px 0 0; font-size: .8rem; color: var(--muted); }
    main { max-width: 920px; margin: 0 auto; padding: 16px 16px 120px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 14px;
    }
    .card-head {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; font-weight: 600;
    }
    .card-head i { color: var(--brand); width: 18px; height: 18px; }
    label.field {
      display: grid; gap: 6px; font-size: .85rem; font-weight: 500; color: var(--muted);
    }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font: inherit; color: var(--ink); background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #c7d2fe; border-color: var(--brand);
    }
    .hint {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--brand-soft); color: #3730a3;
      border-radius: 14px; padding: 12px 14px; font-size: .9rem; margin-bottom: 14px;
    }
    .hint i { flex-shrink: 0; margin-top: 2px; }
    .subject {
      border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 10px; background: #fafbfc;
      transition: border-color .15s, background .15s;
    }
    .subject.active { background: #fff; border-color: #c7d2fe; }
    .subject-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 10px;
    }
    .subject-name {
      display: flex; align-items: center; gap: 10px; font-weight: 600;
    }
    .subject-name .badge {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--brand-soft); color: var(--brand);
      display: grid; place-items: center;
    }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .grid .full { grid-column: 1 / -1; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(244,246,251,.95) 30%, var(--bg));
    }
    .bar-inner { max-width: 920px; margin: 0 auto; display: flex; gap: 10px; }
    button {
      border: none; border-radius: 14px; font: inherit; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 18px;
    }
    button.primary {
      flex: 1; background: var(--brand); color: #fff;
      box-shadow: 0 10px 24px rgba(79,70,229,.28);
    }
    button.primary:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
    button.ghost {
      background: #fff; color: var(--ink); border: 1px solid var(--line);
    }
    #toast {
      display: none; margin-top: 12px; border-radius: 14px; padding: 12px 14px;
      font-size: .92rem; white-space: pre-wrap;
    }
    #toast.ok { display: flex; gap: 10px; background: var(--ok-bg); color: var(--ok); }
    #toast.err { display: flex; gap: 10px; background: var(--err-bg); color: var(--err); }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="logo" aria-hidden="true"><i data-lucide="notebook-pen"></i></div>
      <div class="titles">
        <h1>Class 8 Homework</h1>
        <p>Admin · publish today’s work</p>
      </div>
    </div>
  </header>

  <main>
    <div class="hint">
      <i data-lucide="info"></i>
      <div>Fill only subjects that have homework. Page is optional. Description & notes support multi-line Markdown. Leave description empty to skip a subject.</div>
    </div>

    <section class="card">
      <div class="card-head"><i data-lucide="lock"></i> Admin access</div>
      <label class="field">Password
        <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password" />
      </label>
    </section>

    <section class="card">
      <div class="card-head"><i data-lucide="book-open"></i> Subjects</div>
      <div id="subjects"></div>
    </section>

    <div id="toast" role="status"></div>
  </main>

  <div class="bar">
    <div class="bar-inner">
      <button type="button" class="ghost" id="clearBtn"><i data-lucide="eraser"></i> Clear</button>
      <button type="button" class="primary" id="submit"><i data-lucide="send"></i> Publish</button>
    </div>
  </div>

<script>
const SUBJECTS = [
  ['english','English','book-a'],
  ['urdu','Urdu','languages'],
  ['mathematics','Mathematics','calculator'],
  ['science','Science','flask-conical'],
  ['islamiat','Islamiat','moon-star'],
  ['tarjama-tul-quran','Tarjama-tul-Quran','book-marked'],
  ['ethics','Ethics','heart-handshake'],
  ['drawing','Drawing','palette'],
  ['geography','Geography','globe-2'],
  ['history','History','landmark'],
  ['computer-science','Computer Science','cpu'],
];

const container = document.getElementById('subjects');
SUBJECTS.forEach(([key, label, icon]) => {
  const el = document.createElement('article');
  el.className = 'subject';
  el.dataset.subject = key;
  el.innerHTML = `
    <div class="subject-top">
      <div class="subject-name">
        <span class="badge"><i data-lucide="${icon}"></i></span>
        <span>${label}</span>
      </div>
    </div>
    <div class="grid">
      <label class="field">Page <span style="font-weight:400;opacity:.7">(optional)</span>
        <input data-field="page" data-subject="${key}" placeholder="e.g. 42 or 42–45" />
      </label>
      <label class="field">Source
        <select data-field="source" data-subject="${key}">
          <option value="book">Book</option>
          <option value="guide">Guide</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label class="field full">Description <span style="font-weight:400;opacity:.7">(Markdown OK)</span>
        <textarea data-field="description" data-subject="${key}" rows="3" placeholder="What to do — multi-line & Markdown supported. Leave empty to skip."></textarea>
      </label>
      <label class="field full">Notes <span style="font-weight:400;opacity:.7">(optional, Markdown OK)</span>
        <textarea data-field="notes" data-subject="${key}" rows="2" placeholder="e.g. Bring geometry box"></textarea>
      </label>
    </div>`;
  container.appendChild(el);
});

function wireActive() {
  document.querySelectorAll('.subject').forEach((card) => {
    const desc = card.querySelector('[data-field="description"]');
    const sync = () => card.classList.toggle('active', !!(desc.value || '').trim());
    desc.addEventListener('input', sync);
    sync();
  });
}
wireActive();

const toast = document.getElementById('toast');
const btn = document.getElementById('submit');

function showToast(kind, text) {
  toast.className = kind === 'ok' ? 'ok' : 'err';
  toast.innerHTML = `<i data-lucide="${kind === 'ok' ? 'circle-check' : 'circle-alert'}"></i><div>${text}</div>`;
  lucide.createIcons();
}

btn.addEventListener('click', async () => {
  toast.className = '';
  toast.textContent = '';
  const password = document.getElementById('password').value;
  if (!password) {
    showToast('err', 'Please enter the admin password.');
    return;
  }
  const entries = [];
  for (const [s] of SUBJECTS) {
    const val = (field) =>
      document.querySelector(`[data-subject="${s}"][data-field="${field}"]`).value.trim();
    const description = val('description');
    if (!description) continue;
    entries.push({
      subject: s,
      page: val('page'),
      description,
      source: val('source'),
      notes: val('notes')
    });
  }
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-circle" class="spin"></i> Publishing…';
  lucide.createIcons();
  try {
    const res = await fetch('/api/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, entries })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('ok', `${data.message}\nSubjects saved: ${data.data?.subjectsUpdated ?? entries.length}\nTime: ${data.data?.timestamp ?? ''}`);
    } else {
      showToast('err', `[${data.code}] ${data.message}`);
    }
  } catch (e) {
    showToast('err', 'Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="send"></i> Publish';
    lucide.createIcons();
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.querySelectorAll('input[data-field], select[data-field], textarea[data-field]').forEach((el) => {
    if (el.tagName === 'SELECT') el.value = 'book';
    else el.value = '';
  });
  wireActive();
  toast.className = '';
  toast.textContent = '';
});

lucide.createIcons();
</script>
</body>
</html>
